<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>semantic layout example</title>
</head>

<body>

    <!-- header contains introductory content for the page -->
    <header>
        <h1>site title</h1>
    </header>

    <!-- nav contains the main navigation links -->
    <nav>
        <a href="#">home</a>
        <a href="#">about</a>
        <a href="#">contact</a>
    </nav>

    <!-- main contains the primary content of the page -->
    <main>

        <!-- section groups related content under a common topic -->
        <section>
            <h2>section heading</h2>
            <p>section content goes here.</p>
        </section>

        <!-- article represents content that can stand on its own -->
        <article>
            <h2>article heading</h2>
            <p>article content goes here.</p>
        </article>

        <!-- aside contains related or secondary information -->
        <aside>
            <h2>related content</h2>
            <p>secondary content goes here.</p>
        </aside>

    </main>

    <!-- footer contains closing or supporting page information -->
    <footer>
        <p>footer content</p>
    </footer>

</body>

</html>
