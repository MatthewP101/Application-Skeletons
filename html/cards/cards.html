<!DOCTYPE html>

<!-- tells the browser that this document uses html5 -->
<html lang="en">

<head>
    <!-- defines the character encoding used by the page -->
    <meta charset="UTF-8">

    <!-- makes the page scale correctly across different screen sizes -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- text displayed in the browser tab -->
    <title>card example</title>
</head>

<body>

    <!-- article is useful for content that can stand on its own -->
    <!-- this makes it a good semantic element for cards -->
    <article class="card">

        <!-- optional image displayed at the top of the card -->
        <!-- alt provides a text description if the image cannot be seen -->
        <img src="image.jpg" alt="description of image">

        <!-- contains the main written content of the card -->
        <div class="card-content">

            <!-- heading describing the card -->
            <h2>card title</h2>

            <!-- short description or information belonging to the card -->
            <p>
                card description goes here.
            </p>

            <!-- link used to take the user to more information -->
            <a href="#">learn more</a>

        </div>

    </article>

</body>

</html>
