<!DOCTYPE html>

<!-- tells the browser that this document uses html5 -->
<html lang="en">

<head>
    <!-- defines the character encoding used by the page -->
    <meta charset="UTF-8">

    <!-- makes the page scale correctly across different screen sizes -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- text displayed in the browser tab -->
    <title>navbar example</title>
</head>

<body>

    <!-- nav represents the main navigation area of the website -->
    <!-- aria-label gives the navigation a clear description for accessibility -->
    <nav aria-label="main navigation">

        <!-- site name or logo can be placed here -->
        <!-- this link normally returns the user to the home page -->
        <a href="#">site name</a>

        <!-- unordered lists are commonly used to organise navigation links -->
        <ul>

            <!-- each list item contains one navigation option -->
            <li>
                <a href="#">home</a>
            </li>

            <li>
                <a href="#">about</a>
            </li>

            <li>
                <a href="#">projects</a>
            </li>

            <li>
                <a href="#">contact</a>
            </li>

        </ul>

    </nav>

</body>

</html>
