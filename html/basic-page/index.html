<!DOCTYPE html>

<!-- tells the browser that this document uses html5 -->
<html lang="en">

<head>
    <!-- defines the character encoding used by the page -->
    <!-- utf-8 supports almost all commonly used characters and symbols -->
    <meta charset="UTF-8">

    <!-- makes the page scale correctly on phones, tablets, and other screen sizes -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- short description of the page -->
    <!-- search engines may use this when displaying the page in search results -->
    <meta name="description" content="page description">

    <!-- text displayed in the browser tab -->
    <title>page title</title>

    <!-- connects an external css file to the page -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- header contains introductory content such as the site title or navigation -->
    <header>

        <!-- main heading of the page -->
        <h1>page heading</h1>

        <!-- navigation contains links to important areas of the website -->
        <nav>
            <a href="#">home</a>
            <a href="#">about</a>
            <a href="#">contact</a>
        </nav>

    </header>

    <!-- main contains the primary content of the page -->
    <!-- there should normally only be one main element per page -->
    <main>

        <!-- section groups related content together -->
        <section>
            <h2>section heading</h2>

            <p>
                page content goes here.
            </p>
        </section>

    </main>

    <!-- footer contains information placed at the bottom of the page -->
    <footer>
        <p>footer content</p>
    </footer>

    <!-- connects an external javascript file to the page -->
    <!-- placing it at the bottom allows the html to load before the script runs -->
    <script src="script.js"></script>

</body>

</html>
